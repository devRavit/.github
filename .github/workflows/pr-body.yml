name: PR body & labels

# 호출 repo 의 PR 이 이 repo 의 PULL_REQUEST_TEMPLATE.md 를 따르는지, 종류 라벨이 붙었는지 검증한다.
# 헤딩 목록은 템플릿 파일에서 읽는다 — 템플릿을 고치면 모든 호출 repo 의 검사가 함께 바뀐다(단일 소스).

on:
  workflow_call:
    inputs:
      label_pattern:
        description: "종류 라벨로 인정할 이름 정규식 — 하나 이상 붙어 있어야 통과"
        required: false
        type: string
        default: "^(type/.+|bug|enhancement|documentation|ci)$"
      template_ref:
        description: "헤딩을 읽을 devRavit/.github ref"
        required: false
        type: string
        default: "main"

permissions:
  contents: read
  pull-requests: read

jobs:
  required-sections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: devRavit/.github
          ref: ${{ inputs.template_ref }}
          path: dotgithub
          sparse-checkout: .github/PULL_REQUEST_TEMPLATE.md
          sparse-checkout-cone-mode: false

      - name: Check template headings
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          template=dotgithub/.github/PULL_REQUEST_TEMPLATE.md
          mapfile -t required < <(grep -E '^## ' "$template")
          (( ${#required[@]} > 0 )) || { echo "❌ 템플릿에서 헤딩을 읽지 못했습니다: $template"; exit 1; }
          missing=()
          for heading in "${required[@]}"; do
            grep -qxF "$heading" <<<"${BODY//$'\r'/}" || missing+=("$heading")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "❌ PR 본문에 템플릿 헤딩이 없습니다 (헤딩 줄을 그대로 — 영문 괄호까지):"
            printf '  - %s\n' "${missing[@]}"
            echo
            echo "템플릿: https://github.com/devRavit/.github/blob/main/.github/PULL_REQUEST_TEMPLATE.md"
            exit 1
          fi
          echo "✅ 템플릿 헤딩 ${#required[@]} 개 모두 있음"

  required-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Check kind label
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PATTERN: ${{ inputs.label_pattern }}
        run: |
          set -euo pipefail
          if jq -e --arg pattern "$PATTERN" 'any(.[]; test($pattern))' <<<"$LABELS" >/dev/null; then
            echo "✅ 라벨: $LABELS"
          else
            echo "❌ 종류 라벨이 없습니다 — 다음 패턴에 맞는 라벨을 하나 이상 붙이세요: $PATTERN"
            echo "현재 라벨: $LABELS"
            exit 1
          fi
